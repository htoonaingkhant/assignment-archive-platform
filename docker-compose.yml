services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assignment
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U postgres -d assignment']
      timeout: 5s
    ports:
      - '5432:5432'
    volumes:
      - assignment_postgres_data:/var/lib/postgresql/data

volumes:
  assignment_postgres_data:
