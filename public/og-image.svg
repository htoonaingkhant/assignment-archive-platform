<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper background -->
  <rect width="1200" height="630" fill="#FAF5EE"/>
  
  <!-- Black border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#0F0F0F" stroke-width="8"/>
  
  <!-- Top checker strip -->
  <defs>
    <pattern id="checkerTop" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#0F0F0F"/>
      <rect x="10" y="10" width="10" height="10" fill="#0F0F0F"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="40" fill="url(#checkerTop)"/>
  
  <!-- Bottom checker strip -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#checkerTop)"/>
  
  <!-- Logo container -->
  <rect x="520" y="100" width="160" height="160" fill="#FF6B35" stroke="#0F0F0F" stroke-width="6"/>
  <rect x="528" y="108" width="144" height="144" fill="none" stroke="#0F0F0F" stroke-width="4"/>
  
  <!-- Book icon in logo -->
  <g transform="translate(560, 140)">
    <rect x="0" y="0" width="35" height="55" fill="#FAF5EE" stroke="#0F0F0F" stroke-width="3"/>
    <rect x="35" y="0" width="35" height="55" fill="#FAF5EE" stroke="#0F0F0F" stroke-width="3"/>
    <line x1="35" y1="0" x2="35" y2="55" stroke="#0F0F0F" stroke-width="3"/>
    <line x1="8" y1="15" x2="27" y2="15" stroke="#0F0F0F" stroke-width="2"/>
    <line x1="8" y1="25" x2="27" y2="25" stroke="#0F0F0F" stroke-width="2"/>
    <line x1="43" y1="15" x2="62" y2="15" stroke="#0F0F0F" stroke-width="2"/>
    <line x1="43" y1="25" x2="62" y2="25" stroke="#0F0F0F" stroke-width="2"/>
  </g>
  
  <!-- Main heading -->
  <text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" text-anchor="middle" fill="#0F0F0F" letter-spacing="-2">
    ASSIGNMENT ARCHIVE
  </text>
  
  <!-- Tagline box -->
  <rect x="370" y="380" width="460" height="80" fill="#FF6B35" stroke="#0F0F0F" stroke-width="4"/>
  <rect x="378" y="388" width="444" height="64" fill="none" stroke="#0F0F0F" stroke-width="2"/>
  <text x="600" y="432" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0F0F0F">
    Answers that stay findable
  </text>
  
  <!-- Features -->
  <g transform="translate(230, 520)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F0F0F">
      📚 Searchable
    </text>
    <text x="230" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F0F0F">
      •
    </text>
    <text x="280" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F0F0F">
      ✓ Reviewed
    </text>
    <text x="480" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F0F0F">
      •
    </text>
    <text x="530" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#0F0F0F">
      🎯 Organized
    </text>
  </g>
  
  <!-- Decorative elements -->
  <rect x="80" y="480" width="50" height="12" fill="#FF6F61"/>
  <rect x="1070" y="150" width="50" height="12" fill="#FF6F61"/>
</svg>
